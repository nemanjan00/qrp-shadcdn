# render.com blueprint — deploy the demo as a static site.
# The repo's demo/ is unbundled (import map to ../dist and ../node_modules), so the
# build bundles it into one module and inlines the CSS for first paint
# (bin/build-site.js).
services:
  - type: web
    name: qrp-shadcdn
    runtime: static
    buildCommand: npm ci && npm run build:site
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
